name: RSpec Accessibility Tests

on:
    pull_request:
    # push:
    # branches: [ main ]
    workflow_dispatch:

jobs:
    rspec-accessibility:
        continue-on-error: true
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgis/postgis:16-3.5
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

            redis:
                image: redis
                ports:
                    - 6379:6379
                options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

        env:
            RAILS_ENV: test
            DATABASE_URL: postgis://postgres:postgres@localhost:5432
            RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
            REDIS_URL: redis://localhost:6379/0
            PLANE_BASE_URL: ${{ secrets.PLANE_BASE_URL }}
            PLANE_WORKSPACE_SLUG: ${{ secrets.PLANE_WORKSPACE_SLUG }}
            PLANE_PROJECT_ID: ${{ secrets.PLANE_PROJECT_ID }}
            PLANE_STRING_PROJECT_ID: ${{ secrets.PLANE_STRING_PROJECT_ID }}
            PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}

        steps:
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev pkg-config

            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: .ruby-version
                  bundler-cache: true

            - name: Set up Chrome
              uses: browser-actions/setup-chrome@v2
              with:
                chrome-version: '151'
                install-chromedriver: true

            - name: Install JS Dependencies & Build CSS
              run: |
                  yarn install
                  yarn build:css

            - name: Prepare Database
              run: bin/rails db:prepare

            - name: Run Accessibility Tests
              run: bundle exec rspec spec/system/accessibility

            - name: Upload Accessibility Reports and Screenshots
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: accessibility-artifacts
                  path: |
                    ${{ github.workspace }}/tmp/axe-results/
                    ${{ github.workspace }}/tmp/capybara/
                  if-no-files-found: ignore
            
            - name: Unique Violation Count
              id: unique_violations_count
              if: always()
              run: |
                OUTPUT=$(bundle exec rake accessibility:unique_violations_count)
                echo "unique_violations_count<<EOF" >> $GITHUB_OUTPUT
                echo "$OUTPUT" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

            - name: Existing Tickets Count
              id: existing_tickets
              if: always()
              run: |
                OUTPUT=$(bundle exec rake accessibility:existing_tickets_count)
                echo "existing_tickets<<EOF" >> $GITHUB_OUTPUT
                echo "$OUTPUT" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

            - name: New Violations
              id: new_violations
              if: always()
              run: |
                OUTPUT=$(bundle exec rake accessibility:new_violations)
                echo "new_violations<<EOF" >> $GITHUB_OUTPUT
                echo "$OUTPUT" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

            - name: Resolved Violations
              id: resolved_violations
              if: always()
              run: |
                OUTPUT=$(bundle exec rake accessibility:resolved_violations)
                echo "resolved_violations<<EOF" >> $GITHUB_OUTPUT
                echo "$OUTPUT" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

            - name: Post PR Comment with Results
              uses: actions/github-script@v7
              if: always() && github.event_name == 'pull_request' 
              env:
                VIOLATION_COUNT: ${{ steps.unique_violations_count.outputs.unique_violations_count }}
                EXISTING_TICKETS: ${{ steps.existing_tickets.outputs.existing_tickets }}
                NEW_VIOLATIONS: ${{ steps.new_violations.outputs.new_violations }}
                RESOLVED_VIOLATIONS: ${{ steps.resolved_violations.outputs.resolved_violations }}
              with:
                script: |
                  const { data: comments } = await github.rest.issues.listComments({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                  })
                  const botComment = comments.find(comment => {
                      return comment.user.type === 'Bot' && comment.body.includes('Accessibility Test Results')
                  })

                  const output = `### Accessibility Test Results

                  ${process.env.VIOLATION_COUNT}
                  
                  ${process.env.EXISTING_TICKETS}

                  ${process.env.NEW_VIOLATIONS}

                  ${process.env.RESOLVED_VIOLATIONS}

                  *Pusher: @${{ github.actor }} | Last Checked: ${new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'UTC' })} UTC*`;

                  if (botComment) {
                      await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: botComment.id,
                          body: output
                      })
                  } else {
                      await github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: output
                      })
                  }