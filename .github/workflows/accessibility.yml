name: RSpec Accessibility Tests

on:
    pull_request:
    # push:
    # branches: [ main ]
    workflow_dispatch:

jobs:
    rspec-accessibility:
        continue-on-error: true
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgis/postgis:16-3.5
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

            redis:
                image: redis
                ports:
                    - 6379:6379
                options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

        env:
            RAILS_ENV: test
            DATABASE_URL: postgis://postgres:postgres@localhost:5432
            RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
            REDIS_URL: redis://localhost:6379/0

        steps:
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev pkg-config google-chrome-stable

            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: .ruby-version
                  bundler-cache: true

            - name: Install JS Dependencies & Build CSS
              run: |
                  yarn install
                  yarn build:css

            - name: Prepare Database
              run: bin/rails db:prepare

            - name: Run Accessibility Tests
              run: bundle exec rspec spec/system/accessibility

            - name: Upload Accessibility JSON Reports
              uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: accessibility-reports
                  path: ${{ github.workspace }}/tmp/axe-results/
                  if-no-files-found: warn

            - name: Upload screenshots on failure
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: rspec-accessibility-screenshots
                  path: ${{ github.workspace }}/tmp/capybara/
                  if-no-files-found: ignore

            - name: Get Violation Count
              id: get_violations
              run: |
                  echo "summary=$(bundle exec rake plane:get_unique_violations)" >> $GITHUB_OUTPUT

            - name: Post PR Comment with Results
              uses: actions/github-script@v7
              if: always() && github.event_name == 'pull_request' 
              env:
                  VIOLATION_COUNT: ${{ steps.get_violations.outputs.summary }}
              with:
                  script: |
                      // 1. Retrieve existing bot comments for the PR
                      const { data: comments } = await github.rest.issues.listComments({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                      })
                      const botComment = comments.find(comment => {
                          return comment.user.type === 'Bot' && comment.body.includes('Accessibility Test Results')
                      })

                      // 2. Prepare format of the comment
                      const output = `### Accessibility Test Results

                      <details><summary>View Report Summary</summary>
                      
                      ${process.env.VIOLATION_COUNT}
                      
                      </details>
                      
                      *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

                      // 3. If we have a comment, update it, otherwise create a new one
                      if (botComment) {
                          await github.rest.issues.updateComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              comment_id: botComment.id,
                              body: output
                          })
                      } else {
                          await github.rest.issues.createComment({
                              issue_number: context.issue.number,
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              body: output
                          })
                      }