name: RSpec Accessibility Tests

on:
    pull_request:
    # push:
    # branches: [ main ]
    workflow_dispatch:

jobs:
    rspec-accessibility:
        continue-on-error: true
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgis/postgis:16-3.5
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

            redis:
                image: redis
                ports:
                    - 6379:6379
                options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

        env:
            RAILS_ENV: test
            DATABASE_URL: postgis://postgres:postgres@localhost:5432
            RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
            REDIS_URL: redis://localhost:6379/0
            PLANE_BASE_URL: ${{ vars.PLANE_BASE_URL }}
            PLANE_WORKSPACE_SLUG: ${{ vars.PLANE_WORKSPACE_SLUG }}
            PLANE_PROJECT_ID: ${{ vars.PLANE_PROJECT_ID }}
            PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}

        steps:
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev pkg-config google-chrome-stable

            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: .ruby-version
                  bundler-cache: true

            - name: Install JS Dependencies & Build CSS
              run: |
                  yarn install
                  yarn build:css

            - name: Prepare Database
              run: bin/rails db:prepare

            - name: Run Accessibility Tests
              run: bundle exec rspec spec/system/accessibility

            - name: Upload Accessibility JSON Reports
              uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: accessibility-reports
                  path: ${{ github.workspace }}/tmp/axe-results/
                  if-no-files-found: warn

            - name: Upload screenshots on failure
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: rspec-accessibility-screenshots
                  path: ${{ github.workspace }}/tmp/capybara/
                  if-no-files-found: ignore
            
            - name: Get Unique Violation Summary
              id: get_violations
              if: always()
              run: |
                echo "summary=$(bundle exec rake plane:get_unique_violations)" >> $GITHUB_OUTPUT

            - name: Get Existing Tickets Count
              id: get_existing_tickets
              if: always()
              run: |
                OUTPUT=$(bundle exec rake plane:get_existing_tickets_count)
                echo "existing_tickets<<EOF" >> $GITHUB_OUTPUT
                echo "$OUTPUT" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

            - name: Get New Violations
              id: get_new_violations
              if: always()
              run: |
                OUTPUT=$(bundle exec rake plane:get_new_violations)
                echo "new_violations<<EOF" >> $GITHUB_OUTPUT
                echo "$OUTPUT" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

            - name: Get Resolved Violations
              id: get_resolved_violations
              if: always()
              run: |
                OUTPUT=$(bundle exec rake plane:get_resolved_violations)
                echo "resolved_violations<<EOF" >> $GITHUB_OUTPUT
                echo "$OUTPUT" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

            - name: Post PR Comment with Results
              uses: actions/github-script@v7
              if: always() && github.event_name == 'pull_request' 
              env:
                VIOLATION_COUNT: ${{ steps.get_violations.outputs.summary }}
                EXISTING_TICKETS: ${{ steps.get_existing_tickets.outputs.existing_tickets }}
                NEW_VIOLATIONS: ${{ steps.get_new_violations.outputs.new_violations }}
                RESOLVED_VIOLATIONS: ${{ steps.get_resolved_violations.outputs.resolved_violations }}
              with:
                script: |
                  const { data: comments } = await github.rest.issues.listComments({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                  })
                  const botComment = comments.find(comment => {
                      return comment.user.type === 'Bot' && comment.body.includes('Accessibility Test Results')
                  })

                  const output = `### Accessibility Test Results

                  <details><summary>View Report Summary</summary>

                  ${process.env.VIOLATION_COUNT}

                  </details>

                  ### Plane Sync Status
                  \`\`\`text
                  ${process.env.EXISTING_TICKETS}

                  ${process.env.NEW_VIOLATIONS}

                  ${process.env.RESOLVED_VIOLATIONS}
                  \`\`\`

                  *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

                  if (botComment) {
                      await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: botComment.id,
                          body: output
                      })
                  } else {
                      await github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: output
                      })
                  }